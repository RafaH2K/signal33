<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- SEO -->
    <title>Find Your Frequency | SIGNAL33</title>
    <meta
      name="description"
      content="Find Your Frequency — música, eventos, boletos y tienda de SIGNAL33."
    />
    <link
      rel="canonical"
      href="https://findyourfrequency.com.mx/"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Find Your Frequency" />
    <meta property="og:title" content="Find Your Frequency | SIGNAL33" />
    <meta
      property="og:description"
      content="Música, eventos, boletos y tienda de SIGNAL33."
    />
    <meta
      property="og:url"
      content="https://findyourfrequency.com.mx/"
    />
    <!-- Agrega aquí tu imagen OG cuando tengas una:
    <meta
      property="og:image"
      content="https://findyourfrequency.com.mx/media/og-image.jpg"
    />
    -->

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Find Your Frequency | SIGNAL33" />
    <meta
      name="twitter:description"
      content="Música, eventos, boletos y tienda de SIGNAL33."
    />
    <!-- Cuando tengas una imagen OG:
    <meta
      name="twitter:image"
      content="https://findyourfrequency.com.mx/media/og-image.jpg"
    />
    -->

    <!-- Apariencia -->
    <meta name="theme-color" content="#090909" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Performance -->
    <link
      rel="preload"
      as="image"
      href="/media/hero-1.webp"
      type="image/webp"
    />

    <!-- Structured Data: identidad del sitio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Find Your Frequency",
        "alternateName": "SIGNAL33",
        "url": "https://findyourfrequency.com.mx/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

</html>
