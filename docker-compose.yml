services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
      NODE_ENV: production
    volumes:
      - uploads:/app/src/uploads
    depends_on:
      db:
        condition: service_healthy

  # aplica las migraciones y termina; corre antes que la API quede lista
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: db
      NODE_ENV: production
    command: ['node', 'src/database/migrate.js']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
